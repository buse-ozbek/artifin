name: CI/CD for Retail Demand Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────
  # CI — testing step
  # ─────────────────────────────────────────────────────────
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo structure
        run: ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Test the prediction service core logic (DummyModel, no MLflow)
      - name: Run prediction service tests
        run: pytest dockerization_and_deployment/webservices/test_prediction_core.py -v

      # predict.py can't be imported in CI (loads model at import time),
      # so just check it has no syntax errors
      - name: Check predict.py syntax
        run: python -m py_compile dockerization_and_deployment/webservices/predict.py

      # Test the monitoring pipeline's FEATURES contract
      - name: Run monitoring tests
        run: pytest monitoring/test/test_calculate_metrics.py -v

  # ─────────────────────────────────────────────────────────
  # CD — deploying step (only runs if CI passed)
  # ─────────────────────────────────────────────────────────
  cd:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TODO: replace YOUR_GITHUB_USERNAME with your actual handle
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/buse-ozbek/retail-predict-service:latest \
            -f dockerization_and_deployment/webservices/Dockerfile \
            .

      - name: Push Docker image
        run: docker push ghcr.io/buse-ozbek/retail-predict-service:latest