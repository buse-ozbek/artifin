<svg width="100%" viewBox="0 0 680 760" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Retail demand monitoring pipeline</title>
  <desc>Five-stage pipeline showing reference dataset, production data, monitoring computation, Postgres storage, and Grafana visualization with Adminer inspection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
      .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
    </style>
  </defs>

  <text class="th" x="340" y="30" text-anchor="middle" style="font-size:18px">Machine learning monitoring pipeline: retail demand</text>

  <g>
    <rect x="20" y="60" width="200" height="280" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="120" y="88" text-anchor="middle" fill="#26215C">1. Reference dataset</text>
    <text class="ts" x="120" y="106" text-anchor="middle" fill="#3C3489">(baseline)</text>
    <rect x="40" y="130" width="160" height="190" rx="8" fill="none" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="120" y="156" text-anchor="middle" fill="#26215C">Retail historical data</text>
    <text class="ts" x="120" y="194" text-anchor="middle" fill="#3C3489">Features</text>
    <text class="ts" x="120" y="212" text-anchor="middle" fill="#3C3489">(price, discount, weather)</text>
    <text class="ts" x="120" y="244" text-anchor="middle" fill="#3C3489">True targets</text>
    <text class="ts" x="120" y="262" text-anchor="middle" fill="#3C3489">(units sold)</text>
    <text class="ts" x="120" y="294" text-anchor="middle" fill="#3C3489">Model predictions</text>
  </g>

  <g>
    <rect x="20" y="370" width="200" height="280" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="120" y="398" text-anchor="middle" fill="#04342C">2. Production data</text>
    <text class="ts" x="120" y="416" text-anchor="middle" fill="#085041">(generated batches + API)</text>
    <rect x="40" y="440" width="160" height="190" rx="8" fill="none" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="120" y="466" text-anchor="middle" fill="#04342C">New batch of retail data</text>
    <text class="ts" x="120" y="484" text-anchor="middle" fill="#085041">(features + drift)</text>
    <text class="ts" x="120" y="514" text-anchor="middle" fill="#085041">FastAPI /predict</text>
    <text class="ts" x="120" y="532" text-anchor="middle" fill="#085041">live requests</text>
    <text class="ts" x="120" y="566" text-anchor="middle" fill="#085041">Trained ML model</text>
    <text class="ts" x="120" y="584" text-anchor="middle" fill="#085041">(regression)</text>
    <text class="ts" x="120" y="614" text-anchor="middle" fill="#085041">New predictions</text>
  </g>

  <g>
    <rect x="250" y="60" width="200" height="590" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="th" x="350" y="88" text-anchor="middle" fill="#4A1B0C">3. Monitoring</text>
    <text class="ts" x="350" y="106" text-anchor="middle" fill="#712B13">(computation step)</text>

    <rect x="270" y="130" width="160" height="160" rx="8" fill="none" stroke="#D85A30" stroke-width="0.5"/>
    <text class="th" x="350" y="156" text-anchor="middle" fill="#4A1B0C">a. Compute drift</text>
    <text class="ts" x="350" y="178" text-anchor="middle" fill="#712B13">Kolmogorov–Smirnov</text>
    <text class="ts" x="350" y="196" text-anchor="middle" fill="#712B13">test per feature</text>
    <text class="ts" x="350" y="226" text-anchor="middle" fill="#712B13">num_drifted_features</text>
    <text class="ts" x="350" y="244" text-anchor="middle" fill="#712B13">share_drifted_features</text>

    <rect x="270" y="310" width="160" height="160" rx="8" fill="none" stroke="#D85A30" stroke-width="0.5"/>
    <text class="th" x="350" y="336" text-anchor="middle" fill="#4A1B0C">b. Evaluate model</text>
    <text class="ts" x="350" y="354" text-anchor="middle" fill="#712B13">performance</text>
    <text class="ts" x="350" y="384" text-anchor="middle" fill="#712B13">MAE</text>
    <text class="ts" x="350" y="402" text-anchor="middle" fill="#712B13">RMSE</text>
    <text class="ts" x="350" y="420" text-anchor="middle" fill="#712B13">R²</text>

    <rect x="270" y="490" width="160" height="140" rx="8" fill="none" stroke="#D85A30" stroke-width="0.5"/>
    <text class="th" x="350" y="516" text-anchor="middle" fill="#4A1B0C">c. Prediction stats</text>
    <text class="ts" x="350" y="546" text-anchor="middle" fill="#712B13">pred_mean</text>
    <text class="ts" x="350" y="564" text-anchor="middle" fill="#712B13">pred_min</text>
    <text class="ts" x="350" y="582" text-anchor="middle" fill="#712B13">pred_max</text>
  </g>

  <g>
    <rect x="480" y="60" width="180" height="380" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="570" y="88" text-anchor="middle" fill="#412402">4. Storage</text>
    <text class="ts" x="570" y="106" text-anchor="middle" fill="#633806">(PostgreSQL)</text>

    <rect x="500" y="130" width="140" height="130" rx="8" fill="none" stroke="#BA7517" stroke-width="0.5"/>
    <text class="th" x="570" y="156" text-anchor="middle" fill="#412402">metrics table</text>
    <text class="ts" x="570" y="186" text-anchor="middle" fill="#633806">one row per batch</text>
    <text class="ts" x="570" y="216" text-anchor="middle" fill="#633806">drift + MAE/RMSE/R²</text>
    <text class="ts" x="570" y="234" text-anchor="middle" fill="#633806">+ pred stats</text>

    <rect x="500" y="280" width="140" height="140" rx="8" fill="none" stroke="#BA7517" stroke-width="0.5"/>
    <text class="th" x="570" y="306" text-anchor="middle" fill="#412402">prediction_logs</text>
    <text class="th" x="570" y="324" text-anchor="middle" fill="#412402">table</text>
    <text class="ts" x="570" y="356" text-anchor="middle" fill="#633806">one row per</text>
    <text class="ts" x="570" y="374" text-anchor="middle" fill="#633806">API call</text>
    <text class="ts" x="570" y="402" text-anchor="middle" fill="#633806">inputs + prediction</text>
  </g>

  <g>
    <rect x="480" y="470" width="180" height="180" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="570" y="498" text-anchor="middle" fill="#042C53">5. Visualization</text>
    <text class="ts" x="570" y="516" text-anchor="middle" fill="#0C447C">(Grafana + Adminer)</text>
    <text class="ts" x="570" y="550" text-anchor="middle" fill="#0C447C">Monitoring dashboard</text>
    <text class="ts" x="570" y="568" text-anchor="middle" fill="#0C447C">drift + performance</text>
    <text class="ts" x="570" y="598" text-anchor="middle" fill="#0C447C">Prediction logs dashboard</text>
    <text class="ts" x="570" y="616" text-anchor="middle" fill="#0C447C">live API traffic</text>
  </g>

  <line x1="220" y1="200" x2="248" y2="200" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="510" x2="248" y2="510" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="210" x2="478" y2="195" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="390" x2="478" y2="345" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="555" x2="478" y2="345" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="440" x2="570" y2="468" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="120" y="690" text-anchor="middle" fill="#5F5E5A">Adminer (port 8080)</text>
  <text class="ts" x="120" y="708" text-anchor="middle" fill="#5F5E5A">SQL query tool</text>
  <text class="ts" x="120" y="726" text-anchor="middle" fill="#5F5E5A">SELECT * FROM metrics</text>
  <line x1="220" y1="710" x2="478" y2="350" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>
</svg>
